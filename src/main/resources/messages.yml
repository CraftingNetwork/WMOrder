config-version: 1
prefix: "<dark_gray>[<gold>WMOrder</gold>]</dark_gray> "
plugin-loading: "<yellow>The marketplace is still starting. Try again shortly."
no-permission: "<red>You do not have permission to do that."
players-only: "<red>This command can only be used by a player."
invalid-number: "<red>Enter a valid positive number."
invalid-order: "<red>Order <order> was not found."
invalid-item: "<red>This item cannot be ordered: <reason>"
invalid-quantity: "<red>Quantity must be between <min> and <max>."
invalid-price: "<red>Price must be between <min> and <max>."
insufficient-funds: "<red>You need <amount>, but your balance is <balance>."
order-created: "<green>Created order <white><order></white> for <quantity>x <item> at <price> each."
order-create-failed: "<red>The order could not be created. Your funds were refunded or queued for recovery."
order-partial: "<yellow>Your order <order> was partially fulfilled: <quantity> items."
order-filled: "<green>Your order <order> is fully filled and ready to collect."
order-cancelled: "<yellow>Order <order> was cancelled. Unused funds are ready to collect."
order-expired: "<yellow>Order <order> expired. Unused funds are ready to collect."
order-frozen: "<red>This order is frozen by an administrator."
sale-complete: "<green>Sold <quantity>x <item> for <amount>."
sale-payment-pending: "<yellow>Your items were accepted, but the payout is pending economy recovery."
no-matching-items: "<red>You do not have matching items to sell."
collection-empty: "<gray>You have nothing ready to collect."
collection-available: "<green>You have <count> collection entries ready. Use <white>/order collect</white>."
collection-result: "<green>Collected <items> items and <money> in payments/refunds."
collection-partial: "<yellow>Your inventory was full. Remaining items stay safely stored."
search-rate-limited: "<red>You are searching too quickly."
cooldown: "<red>Please wait <seconds>s before doing that again."
input-price: "<yellow>Type the price per item in chat, or type <white>cancel</white>."
input-search: "<yellow>Type your search query in chat, or type <white>cancel</white>."
input-cancelled: "<gray>Input cancelled."
confirmation-required: "<yellow>Repeat the command with <white>confirm</white> within 30 seconds."
admin-action-complete: "<green>Administrative action completed."
admin-action-failed: "<red>Administrative action failed: <reason>"
reload-complete: "<green>Reloaded messages, GUI, categories, item rules, and reload-safe settings."
notifications-enabled: "<green>Marketplace notifications enabled."
notifications-disabled: "<yellow>Nonessential marketplace notifications disabled."
help:
  - "<gold>/order</gold> - Browse orders"
  - "<gold>/order create</gold> - Create a buy order from your held item"
  - "<gold>/order my</gold> - View your active orders"
  - "<gold>/order collect</gold> - Collect items and refunds"
  - "<gold>/order history</gold> - View order history"
  - "<gold>/order search <query></gold> - Search the market"
  - "<gold>/order cancel <id></gold> - Cancel your order"
  - "<gold>/order notify</gold> - Toggle nonessential notifications"
